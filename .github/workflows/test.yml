name: "Test"
on:
  pull_request:
  push:
jobs:
  test-nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
          # Nix Flakes doesn't work on shallow clones
          fetch-depth: 0

    - uses: NixOS/nix-installer-action@main

    - uses: Mic92/niks3-action@v1
      with:
        server-url: https://niks3.fu.io

    - run: nix-build
  test:
    strategy:
      matrix:
        go-version:
        - 1.26.x
        - 1.27.x
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Format
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi
      if: matrix.os == 'ubuntu-latest'
    - name: Test
      # Production builds of the gin version use -tags=jsoniter (see Dockerfile
      # and flake.nix); without it gin cannot encode c.Keys on some Go versions.
      run: go test -race -tags=jsoniter ./...
